name: Deploy Web (Firebase Hosting)

on:
  push:
    branches: [main]
    paths:
      - 'apps/web/**'
      - 'firebase.json'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/deploy-web.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  GCP_RUNTIME_SA_EMAIL: ${{ vars.GCP_RUNTIME_SA_EMAIL }}
  GCP_WIF_PROVIDER: ${{ vars.GCP_WIF_PROVIDER }}
  GCP_DEPLOY_SA_EMAIL: ${{ vars.GCP_DEPLOY_SA_EMAIL }}

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build web
        run: pnpm web:build

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA_EMAIL }}
          token_format: access_token

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Validate required variables
        run: |
          if [ -z "${GCP_PROJECT_ID}" ]; then
            echo "GCP_PROJECT_ID is missing"
            exit 1
          fi

          if [ -z "${GCP_RUNTIME_SA_EMAIL}" ]; then
            echo "GCP_RUNTIME_SA_EMAIL is missing"
            exit 1
          fi

          if [ -z "${GCP_WIF_PROVIDER}" ]; then
            echo "GCP_WIF_PROVIDER is missing"
            exit 1
          fi

          if [ -z "${GCP_DEPLOY_SA_EMAIL}" ]; then
            echo "GCP_DEPLOY_SA_EMAIL is missing"
            exit 1
          fi

      - name: Deploy to Firebase Hosting
        run: |
          firebase deploy \
            --project "${GCP_PROJECT_ID}" \
            --token "${{ steps.auth.outputs.access_token }}" \
            --only hosting \
            --non-interactive
