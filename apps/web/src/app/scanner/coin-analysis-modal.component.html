<div class="analysis-modal-backdrop" role="dialog" aria-modal="true">
  <div class="analysis-modal" tabindex="-1">
    <header class="analysis-modal-header">
      <h2>{{ candidate?.symbol }}</h2>
      <div class="analysis-meta">
        <span>Price: {{ formatMarketPrice(candidate?.market.lastPrice) }}</span>
        <span>Status: <strong>{{ candidate?.status }}</strong></span>
        <span>Score: {{ candidate?.score | number: '1.2-2' }}</span>
      </div>
      <div class="modal-actions">
        <button type="button" class="copy-button" (click)="requestCopyAnalysis()">Copy for Analysis</button>
        <button type="button" class="copy-button" (click)="copyChartsAsImage()">Copy Charts</button>
        <button type="button" class="modal-close" (click)="requestClose()">Close</button>
      </div>
    </header>

    <div class="analysis-modal-body">
      <details class="collapsible-section modal-analysis" open>
        <summary>Analysis data</summary>
        <div class="collapsible-content">
          <pre>{{ analysisText }}</pre>
        </div>
      </details>

      <details class="collapsible-section modal-charts">
        <summary>Charts</summary>
        <div class="collapsible-content charts-content">
          <div class="chart-card">
            <h3>1H</h3>
            <div id="chart-1h" class="chart-host" aria-label="1 hour chart">
              <div *ngIf="status1h !== 'ready'" class="chart-loading">{{ status1hMessage }}</div>
            </div>
          </div>

          <div class="chart-card">
            <h3>15M</h3>
            <div id="chart-15m" class="chart-host" aria-label="15 minute chart">
              <div *ngIf="status15m !== 'ready'" class="chart-loading">{{ status15mMessage }}</div>
            </div>
          </div>
        </div>
      </details>
    </div>
  </div>
</div>
