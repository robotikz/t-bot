<button
  type="button"
  class="header-help"
  [attr.aria-label]="'Show help for ' + label"
  [attr.aria-describedby]="isOpen ? tooltipId : null"
  [attr.aria-expanded]="isOpen"
  [attr.aria-controls]="tooltipId"
  (click)="toggle($event)"
>
  ?
</button>

@if (isOpen) {
  <div
    #tooltipEl
    class="column-tooltip"
    role="tooltip"
    [id]="tooltipId"
    [ngStyle]="tooltipStyle"
    (click)="close($event)"
  >
    {{ helpText }}
  </div>
}
